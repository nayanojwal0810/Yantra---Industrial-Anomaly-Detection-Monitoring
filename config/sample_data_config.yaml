version: "1.0.0"

official_sources:
  endpoint_index: "https://api.usaspending.gov/docs/endpoints"
  spending_by_award_contract: "https://github.com/fedspendingtransparency/usaspending-api/blob/master/usaspending_api/api_contracts/contracts/v2/search/spending_by_award.md"
  spending_by_award_count_contract: "https://github.com/fedspendingtransparency/usaspending-api/blob/master/usaspending_api/api_contracts/contracts/v2/search/spending_by_award_count.md"
  search_filters_contract: "https://github.com/fedspendingtransparency/usaspending-api/blob/master/usaspending_api/api_contracts/search_filters.md"
  transactions_contract: "https://github.com/fedspendingtransparency/usaspending-api/blob/master/usaspending_api/api_contracts/contracts/v2/transactions.md"
  psc_tree_contract: "https://github.com/fedspendingtransparency/usaspending-api/blob/master/usaspending_api/api_contracts/contracts/v2/references/filter_tree/psc.md"
  psc_manual_page: "https://www.acquisition.gov/psc-manual"
  psc_manual_pdf: "https://www.acquisition.gov/sites/default/files/manual/PSC%20Manual%20April%202025.pdf"
  naics_manual_pdf: "https://www.census.gov/naics/reference_files_tools/2022_NAICS_Manual.pdf"

api_endpoints:
  spending_by_award: "https://api.usaspending.gov/api/v2/search/spending_by_award/"
  spending_by_award_count: "https://api.usaspending.gov/api/v2/search/spending_by_award_count/"
  transactions: "https://api.usaspending.gov/api/v2/transactions/"
  psc_tree: "https://api.usaspending.gov/api/v2/references/filter_tree/psc/?depth=-1"

award_type_codes:
  - "A"
  - "B"
  - "C"
  - "D"

inclusion_families:
  naics_541330:
    type: "naics"
    code: "541330"
    label: "NAICS 541330 — Engineering Services"
  naics_541715:
    type: "naics"
    code: "541715"
    label: "NAICS 541715 — Research and Development in the Physical, Engineering, and Life Sciences (except Nanotechnology and Biotechnology)"
  psc_group_d:
    type: "psc"
    group_id: "D"
    label: "PSC Category D — IT and Telecom"
    expected_category: "Service"
    manual_version: "April 2025"
  psc_group_r:
    type: "psc"
    group_id: "R"
    label: "PSC Category R — Support (Professional/Administrative/Management)"
    expected_category: "Service"
    manual_version: "April 2025"

date_windows:
  "2010_2015":
    start_date: "2010-01-01"
    end_date: "2015-12-31"
  "2016_2019":
    start_date: "2016-01-01"
    end_date: "2019-12-31"
  "2020_2023":
    start_date: "2020-01-01"
    end_date: "2023-12-31"
  "2024_latest":
    start_date: "2024-01-01"
    end_date: null
    resolve_rule: "utc_today"

date_semantics:
  date_type: "new_awards_only"

award_fields:
  - "Award ID"
  - "Recipient Name"
  - "Recipient UEI"
  - "recipient_id"
  - "Recipient Location"
  - "Awarding Agency"
  - "Awarding Agency Code"
  - "Awarding Sub Agency"
  - "Awarding Sub Agency Code"
  - "Funding Agency"
  - "Funding Agency Code"
  - "Funding Sub Agency"
  - "Funding Sub Agency Code"
  - "Description"
  - "Last Modified Date"
  - "Base Obligation Date"
  - "generated_internal_id"
  - "prime_award_recipient_id"
  - "Primary Place of Performance"
  - "Place of Performance City Code"
  - "Place of Performance State Code"
  - "Place of Performance Country Code"
  - "Place of Performance Zip5"
  - "Start Date"
  - "End Date"
  - "Award Amount"
  - "Total Outlays"
  - "Contract Award Type"
  - "NAICS"
  - "PSC"

sampling_parameters:
  seed: 42
  target_rows_per_stratum: 25
  hard_cap_unique_awards: 400
  detail_sample_award_cap: 30
  transaction_page_limit: 100
  award_sort_field: "Award ID"
  award_sort_order: "asc"
  transaction_sort_field: "action_date"
  transaction_sort_order: "asc"

http_policy:
  timeout_seconds: 30
  max_retries: 3
  backoff_factor: 1.5
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

paths:
  raw_data_dir: "data/raw/sample"
  raw_award_counts: "data/raw/sample/raw_award_counts.json"
  raw_award_results: "data/raw/sample/raw_award_results.json"
  raw_transaction_history: "data/raw/sample/raw_transaction_history.json"
  sample_awards_csv: "data/raw/sample/sample_awards.csv"
  sample_transactions_csv: "data/raw/sample/sample_transactions.csv"
  manifest_path: "reports/data_feasibility/sample_query_manifest.json"
  profile_report_path: "reports/data_feasibility/sample_profile.md"
